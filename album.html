<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Detalles</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main id="album-detail-container"></main>

<!-- MODAL AÑADIR/EDITAR CANCIÓN -->
<div id="modal-track" class="modal hidden">
    <div class="modal-content">
        <h2>Añadir Canción</h2>
        <form id="track-form">
            <label for="track-title">Título:</label>
            <input type="text" id="track-title" required placeholder="Ej: Runaway">

            <label for="track-artist">Artistas invitados (opcional):</label>
            <input type="text" id="track-artist" placeholder="Ej: Pusha T">

            <div style="margin-top:15px; display:flex; align-items:center; gap:10px;">
                <input type="checkbox" id="track-interlude" style="width:auto;">
                <label for="track-interlude" style="margin:0; display:inline;">Es un Interlude (Sin nota)</label>
            </div>

            <div id="rating-container">
                <label for="track-rating">Puntuación (0-10):</label>
                <input type="text" id="track-rating" placeholder="Ej: 10">
            </div>

            <div class="modal-actions">
                <button type="button" id="btn-cancel-track">Cancelar</button>
                <button type="submit">Guardar Canción</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL REVIEW -->
<div id="modal-review" class="modal hidden">
    <div class="review-modal-content">
        <div class="review-modal-header">
            <h2 id="review-modal-title">Review</h2>
            <div style="display:flex; gap:12px;">
                <button id="btn-close-review" style="background:var(--bg-secondary); border:1px solid var(--border-color); padding:8px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;">Cancelar</button>
                <button id="btn-save-review" class="save-btn">Guardar</button>
            </div>
        </div>
        <div id="review-editor" class="review-editor"></div>
    </div>
</div>

<!-- MODAL CRÉDITOS -->
<div id="modal-credits" class="modal hidden">
    <div class="modal-content" style="max-width:460px;">
        <h2 id="credits-modal-title">Créditos</h2>
        <div id="credits-modal-body"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/album.js"></script>
</body>
</html>
