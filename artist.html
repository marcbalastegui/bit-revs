<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Estadísticas del Artista</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ── ARTIST HERO ── */
        .artist-hero {
            position: relative;
        }

        /* Banner */
        .artist-banner {
            width: 100%;
            height: 320px;
            background: #1a1a1a;
            background-size: cover;
            background-position: center top;
            position: relative;
            cursor: pointer;
        }

        /* Degradado negro en la parte inferior del banner */
        .artist-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0) 30%,
                rgba(0,0,0,0.6) 65%,
                rgba(0,0,0,0.92) 100%
            );
        }

        .artist-banner:hover #btn-change-banner { opacity: 1 !important; }

        /* Contenido del hero sobre el banner */
        .artist-hero-content {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            display: flex;
            align-items: flex-end;
            gap: 24px;
            padding: 0 40px 28px;
            z-index: 2;
        }

        .artist-avatar-large {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: var(--accent-red);
            color: white;
            font-size: 3rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .artist-hero-text { padding-bottom: 4px; }

        .artist-hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            margin: 0 0 4px;
            color: white;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }

        .artist-hero p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            margin: 0;
            font-weight: 500;
        }

        /* Sin banner — fondo degradado por defecto */
        .artist-banner.no-banner {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }

        /* ── GRID DE STATS ── */
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-subtle);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .col-4  { grid-column: span 4; }
        .col-6  { grid-column: span 6; }
        .col-8  { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.10s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card:nth-child(4) { animation-delay: 0.20s; }
        .stat-card:nth-child(5) { animation-delay: 0.25s; }
        .stat-card:nth-child(6) { animation-delay: 0.30s; }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .stat-value-big {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--accent-red);
            line-height: 1;
        }

        .stat-value-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
        }

        /* ── HIGHLIGHT CARD ── */
        .highlight-card {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .highlight-cover {
            width: 80px; height: 80px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .highlight-info { min-width: 0; }

        .highlight-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .highlight-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .highlight-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 900;
            color: white;
        }

        /* ── GENRE PILLS ── */
        .genres-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .genre-pill {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ── CHART ── */
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
            margin-top: 16px;
        }

        .chart-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            border-radius: 6px 6px 0 0;
            background: var(--accent-red);
            transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 4px;
            position: relative;
        }

        .chart-bar-count {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .chart-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* ── ALBUMS LIST ── */
        .albums-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .album-row {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .album-row:hover { background: var(--bg-secondary); }

        .album-row-cover {
            width: 50px; height: 50px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .album-row-info {
            flex: 1;
            min-width: 0;
        }

        .album-row-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-row-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .album-row-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 900;
            color: white;
            flex-shrink: 0;
        }

        /* ── TRACK ROWS ── */
        .artist-track-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }
        .artist-track-row:hover { background: var(--bg-secondary); }

        .artist-track-rank {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .artist-track-cover {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .artist-track-info {
            flex: 1;
            min-width: 0;
        }

        .artist-track-title {
            font-size: 0.9rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-track-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .col-4  { grid-column: span 6; }
            .col-8  { grid-column: span 12; }
        }

        @media (max-width: 600px) {
            .artist-hero h1 { font-size: 2.5rem; }
            .artist-avatar-large { width: 100px; height: 100px; font-size: 2.5rem; }
            .col-4, .col-6, .col-8 { grid-column: span 12; }
            .stat-value-big { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html">Películas</a>
                <a href="series.html">Series</a>
                <a href="music.html">Música</a>
                <a href="collections.html">Colecciones</a>
            </div>
        </div>
        <a href="top.html">Top</a>
        <a href="wrapped.html">Wrapped</a>
        <a href="lists.html">Listas</a>
    </nav>
    <div class="header-right">
        <button class="save-btn" id="btn-compare-artist" title="Comparar con otro artista" style="font-size:0.82rem;">⇄ Comparar</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <div class="artist-hero" style="max-width:1100px; margin:0 auto 40px; padding:0 20px;">
        <!-- Banner clicable -->
        <div class="artist-banner no-banner" id="artist-banner" style="border-radius:20px; overflow:hidden; cursor:default;">
            <button id="btn-change-banner" style="
                position:absolute; top:12px; right:12px; z-index:4;
                background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
                color:white; border:none; border-radius:8px;
                padding:6px 12px; font-size:0.72rem; font-weight:700;
                cursor:pointer; font-family:'Inter',sans-serif;
                opacity:0; transition:opacity 0.2s; letter-spacing:0.5px;
            ">Cambiar banner</button>
        </div>
        <input type="file" id="input-artist-banner" accept="image/*" style="display:none;">

        <!-- Avatar + nombre sobre el degradado -->
        <div class="artist-hero-content">
            <div class="artist-avatar-large" id="artist-avatar-container" title="Cambiar foto" style="cursor:pointer;">
                <span id="artist-initial">A</span>
                <img id="artist-photo" src="" alt="" style="display:none; width:100%; height:100%; object-fit:cover; position:absolute; inset:0; border-radius:50%;">
                <div id="artist-avatar-overlay" style="position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.2s; font-size:0.6rem; font-weight:800; color:white; letter-spacing:0.5px; text-align:center;">EDITAR</div>
            </div>
            <input type="file" id="input-artist-photo" accept="image/*" style="display:none;">
            <div class="artist-hero-text">
                <h1 id="artist-name">Cargando…</h1>
                <p id="artist-subtitle">Perfil de artista</p>
            </div>
        </div>
    </div>

    <div class="artist-grid" id="artist-grid">
        <div class="stat-card col-12">
            <p style="color: var(--text-muted); text-align: center;">Cargando…</p>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="artist.js"></script>
<script>
    const avatarContainer = document.getElementById('artist-avatar-container');
    const avatarOverlay   = document.getElementById('artist-avatar-overlay');
    if (avatarContainer && avatarOverlay) {
        avatarContainer.addEventListener('mouseover', () => avatarOverlay.style.opacity = '1');
        avatarContainer.addEventListener('mouseout',  () => avatarOverlay.style.opacity = '0');
    }
    // Stop banner click from propagating to avatar
    const bannerEl = document.getElementById('artist-banner');
    if (bannerEl) bannerEl.addEventListener('click', (e) => e.stopPropagation());

    // Botón comparar artistas
    const btnCompare = document.getElementById('btn-compare-artist');
    if (btnCompare) {
        const params     = new URLSearchParams(window.location.search);
        const artistName = params.get('name');
        if (artistName) {
            btnCompare.addEventListener('click', () => {
                window.location.href = `compare-artists.html?a=${encodeURIComponent(artistName)}`;
            });
        } else {
            btnCompare.style.display = 'none';
        }
    }
</script>
</body>
</html>
