<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Estadísticas del Artista</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ── ARTIST PAGE ── */
        .artist-hero {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .artist-hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .artist-avatar-large {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: var(--accent-red);
            color: white;
            font-size: 3.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.2);
        }

        .artist-hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0;
            color: var(--text-main);
        }

        .artist-hero p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }

        /* ── GRID DE STATS ── */
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-subtle);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .col-4  { grid-column: span 4; }
        .col-6  { grid-column: span 6; }
        .col-8  { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.10s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card:nth-child(4) { animation-delay: 0.20s; }
        .stat-card:nth-child(5) { animation-delay: 0.25s; }
        .stat-card:nth-child(6) { animation-delay: 0.30s; }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .stat-value-big {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--accent-red);
            line-height: 1;
        }

        .stat-value-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
        }

        /* ── HIGHLIGHT CARD ── */
        .highlight-card {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .highlight-cover {
            width: 80px; height: 80px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .highlight-info { min-width: 0; }

        .highlight-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .highlight-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .highlight-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 900;
            color: white;
        }

        /* ── GENRE PILLS ── */
        .genres-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .genre-pill {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ── CHART ── */
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
            margin-top: 16px;
        }

        .chart-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            border-radius: 6px 6px 0 0;
            background: var(--accent-red);
            transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 4px;
            position: relative;
        }

        .chart-bar-count {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .chart-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* ── ALBUMS LIST ── */
        .albums-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .album-row {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .album-row:hover { background: var(--bg-secondary); }

        .album-row-cover {
            width: 50px; height: 50px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .album-row-info {
            flex: 1;
            min-width: 0;
        }

        .album-row-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-row-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .album-row-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 900;
            color: white;
            flex-shrink: 0;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .col-4  { grid-column: span 6; }
            .col-8  { grid-column: span 12; }
        }

        @media (max-width: 600px) {
            .artist-hero h1 { font-size: 2.5rem; }
            .artist-avatar-large { width: 100px; height: 100px; font-size: 2.5rem; }
            .col-4, .col-6, .col-8 { grid-column: span 12; }
            .stat-value-big { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="index.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="movies.html">Películas</a>
        <a href="series.html">Series</a>
        <a href="index.html">Álbumes</a>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <div class="artist-hero">
        <div class="artist-hero-content">
            <div class="artist-avatar-large" id="artist-initial">A</div>
            <div>
                <h1 id="artist-name">Cargando…</h1>
                <p id="artist-subtitle">Estadísticas personalizadas</p>
            </div>
        </div>
    </div>

    <div class="artist-grid" id="artist-grid">
        <div class="stat-card col-12">
            <p style="color: var(--text-muted); text-align: center;">Cargando…</p>
        </div>
    </div>
</main>

<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="artist.js"></script>
</body>
</html>
