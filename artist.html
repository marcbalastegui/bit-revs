<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Estadísticas del Artista</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/artist.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button class="save-btn" id="btn-compare-artist" title="Comparar con otro artista" style="font-size:0.82rem;">⇄ Comparar</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div class="artist-hero" style="max-width:1100px; margin:0 auto 40px; padding:0 20px;">
        <!-- Banner clicable -->
        <div class="artist-banner no-banner" id="artist-banner" style="border-radius:20px; overflow:hidden; cursor:default;">
            <button id="btn-change-banner" style="
                position:absolute; top:12px; right:12px; z-index:4;
                background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
                color:white; border:none; border-radius:8px;
                padding:6px 12px; font-size:0.72rem; font-weight:700;
                cursor:pointer; font-family:'Inter',sans-serif;
                opacity:0; transition:opacity 0.2s; letter-spacing:0.5px;
            ">Cambiar banner</button>
        </div>
        <input type="file" id="input-artist-banner" accept="image/*" style="display:none;">

        <!-- Avatar + nombre sobre el degradado -->
        <div class="artist-hero-content">
            <div class="artist-avatar-large" id="artist-avatar-container" title="Cambiar foto" style="cursor:pointer;">
                <span id="artist-initial">A</span>
                <img id="artist-photo" src="" alt="" style="display:none; width:100%; height:100%; object-fit:cover; position:absolute; inset:0; border-radius:50%;">
                <div id="artist-avatar-overlay" style="position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.2s; font-size:0.6rem; font-weight:800; color:white; letter-spacing:0.5px; text-align:center;">EDITAR</div>
            </div>
            <input type="file" id="input-artist-photo" accept="image/*" style="display:none;">
            <div class="artist-hero-text">
                <h1 id="artist-name">Cargando…</h1>
                <p id="artist-subtitle">Perfil de artista</p>
            </div>
        </div>
    </div>

    <div class="artist-grid" id="artist-grid">
        <div class="stat-card col-12">
            <p style="color: var(--text-muted); text-align: center;">Cargando…</p>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/artist.js"></script>
<script>
    const avatarContainer = document.getElementById('artist-avatar-container');
    const avatarOverlay   = document.getElementById('artist-avatar-overlay');
    if (avatarContainer && avatarOverlay) {
        avatarContainer.addEventListener('mouseover', () => avatarOverlay.style.opacity = '1');
        avatarContainer.addEventListener('mouseout',  () => avatarOverlay.style.opacity = '0');
    }
    // Stop banner click from propagating to avatar
    const bannerEl = document.getElementById('artist-banner');
    if (bannerEl) bannerEl.addEventListener('click', (e) => e.stopPropagation());

    // Botón comparar artistas
    const btnCompare = document.getElementById('btn-compare-artist');
    if (btnCompare) {
        const params     = new URLSearchParams(window.location.search);
        const artistName = params.get('name');
        if (artistName) {
            btnCompare.addEventListener('click', () => {
                window.location.href = `compare-artists.html?a=${encodeURIComponent(artistName)}`;
            });
        } else {
            btnCompare.style.display = 'none';
        }
    }
</script>
</body>
</html>
