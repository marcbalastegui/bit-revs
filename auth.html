<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Acceder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/auth.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">BitRevs</div>
        <div class="auth-subtitle">Tu diario de música, películas y series</div>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login">Acceder</div>
            <div class="auth-tab" id="tab-register">Registrarse</div>
        </div>

        <!-- Login -->
        <div class="auth-form active" id="form-login">
            <div class="auth-error" id="login-error"></div>
            <label>Correo electrónico</label>
            <input type="email" id="login-email" placeholder="tu@correo.com" autocomplete="email">
            <label>Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            <button class="auth-btn" id="btn-login">Entrar</button>
        </div>

        <!-- Registro -->
        <div class="auth-form" id="form-register">
            <div class="auth-error" id="register-error"></div>
            <label>Correo electrónico</label>
            <input type="email" id="register-email" placeholder="tu@correo.com" autocomplete="email">
            <label>Contraseña</label>
            <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            <label>Repetir contraseña</label>
            <input type="password" id="register-password2" placeholder="••••••••" autocomplete="new-password">
            <button class="auth-btn" id="btn-register">Crear cuenta</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/pages/auth.js"></script>
</body>
</html>
