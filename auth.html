<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Acceder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --card-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --accent-red: #e63946;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .auth-logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent-red);
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 32px;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 28px;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .auth-tab.active {
            color: var(--text-main);
            border-bottom-color: var(--accent-red);
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 18px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-red);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.2s;
        }
        .auth-btn:hover { opacity: 0.85; }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-error {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: #ff6b74;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">BitRevs</div>
        <div class="auth-subtitle">Tu diario de música, películas y series</div>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login">Acceder</div>
            <div class="auth-tab" id="tab-register">Registrarse</div>
        </div>

        <!-- Login -->
        <div class="auth-form active" id="form-login">
            <div class="auth-error" id="login-error"></div>
            <label>Correo electrónico</label>
            <input type="email" id="login-email" placeholder="tu@correo.com" autocomplete="email">
            <label>Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            <button class="auth-btn" id="btn-login">Entrar</button>
        </div>

        <!-- Registro -->
        <div class="auth-form" id="form-register">
            <div class="auth-error" id="register-error"></div>
            <label>Correo electrónico</label>
            <input type="email" id="register-email" placeholder="tu@correo.com" autocomplete="email">
            <label>Contraseña</label>
            <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            <label>Repetir contraseña</label>
            <input type="password" id="register-password2" placeholder="••••••••" autocomplete="new-password">
            <button class="auth-btn" id="btn-register">Crear cuenta</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
