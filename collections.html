<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Colecciones</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <style>
        /* ── COLLECTIONS PAGE ── */
        .collections-hero {
            padding: 60px 20px 40px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 48px;
        }

        .collections-hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 6px;
        }

        .collections-hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* ── COLLECTIONS GRID ── */
        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* ── COLLECTION CARD ── */
        .collection-card {
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: white;
            box-shadow: var(--shadow-subtle);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .collection-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
        }

        /* Mosaico de portadas */
        .collection-covers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 180px;
            background: var(--bg-secondary);
        }

        .collection-covers img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .collection-covers-empty {
            height: 180px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .collection-covers-empty svg {
            width: 40px;
            height: 40px;
            color: var(--border-color);
        }

        .collection-info {
            padding: 16px 18px 18px;
        }

        .collection-name {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .collection-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .collection-count {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .collection-card-actions {
            display: flex;
            gap: 6px;
            position: absolute;
            top: 10px; right: 10px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .collection-card:hover .collection-card-actions { opacity: 1; }

        /* ── COLLECTION DETAIL ── */
        .collection-detail { display: none; }
        .collection-detail.open { display: block; }

        .collection-detail-header {
            max-width: 1400px;
            margin: 0 auto 32px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .collection-detail-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .collection-detail-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Search inside collection */
        .collection-search-modal {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalFadeIn 0.3s ease;
            overflow: hidden;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .collection-search-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .collection-search-header h2 {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .collection-search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .collection-search-input:focus { border-color: var(--accent-red); outline: none; }

        .collection-search-results {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .collection-search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .collection-search-item:hover { background: var(--bg-secondary); }
        .collection-search-item.added { opacity: 0.4; pointer-events: none; }

        .collection-search-item img {
            width: 40px; height: 40px;
            border-radius: 6px; object-fit: cover; flex-shrink: 0;
        }

        .collection-search-item-info { flex: 1; min-width: 0; }
        .collection-search-item-title {
            font-size: 0.9rem; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .collection-search-item-meta {
            font-size: 0.75rem; color: var(--text-muted);
        }

        .collection-search-item-type {
            font-size: 0.65rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); flex-shrink: 0;
        }

        .collection-search-footer {
            padding: 12px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .collections-hero { flex-direction: column; align-items: flex-start; gap: 16px; }
            .collections-hero h1 { font-size: 2.5rem; }
            .collections-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html">Películas</a>
                <a href="series.html">Series</a>
                <a href="music.html">Music</a>
            </div>
        </div>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
        <a href="collections.html" class="active">Colecciones</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main style="padding:0;">

    <!-- VISTA: LISTA DE COLECCIONES -->
    <div id="view-list">
        <div class="collections-hero">
            <div>
                <h1>Colecciones</h1>
                <p>Agrupa tus favoritos en colecciones temáticas</p>
            </div>
            <button class="save-btn" id="btn-new-collection">+ Nueva colección</button>
        </div>
        <div class="collections-grid" id="collections-grid"></div>
    </div>

    <!-- VISTA: DETALLE DE UNA COLECCIÓN -->
    <div id="view-detail" style="display:none; padding:40px 0 0;">
        <div class="collection-detail-header">
            <div>
                <button onclick="backToList()" style="background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:0.88rem; font-weight:700; font-family:'Inter',sans-serif; padding:0; margin-bottom:12px; display:flex; align-items:center; gap:4px; transition:color 0.2s;" onmouseover="this.style.color='var(--accent-red)'" onmouseout="this.style.color='var(--text-muted)'">← Volver</button>
                <h1 class="collection-detail-title" id="detail-title">Colección</h1>
                <p class="collection-detail-desc" id="detail-desc"></p>
            </div>
            <div style="display:flex; gap:10px; align-items:center; flex-shrink:0;">
                <button class="album-review-btn" id="btn-add-to-collection">+ Añadir</button>
                <button class="album-review-btn" id="btn-edit-collection">✎ Editar</button>
            </div>
        </div>
        <div style="max-width:1400px; margin:0 auto; padding:0 20px 60px;">
            <div class="album-grid" id="detail-grid"></div>
        </div>
    </div>

</main>

<!-- MODAL: NUEVA/EDITAR COLECCIÓN -->
<div id="modal-collection" class="modal hidden">
    <div class="modal-content" style="max-width:440px;">
        <h2 id="collection-modal-title">Nueva colección</h2>
        <form id="collection-form">
            <label>Nombre:</label>
            <input type="text" id="collection-name" required placeholder="Ej: Películas de lluvia">
            <label>Descripción (opcional):</label>
            <input type="text" id="collection-desc" placeholder="Ej: Para ver cuando llueve">
            <div class="modal-actions">
                <button type="button" id="btn-cancel-collection">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: BUSCAR PARA AÑADIR -->
<div id="modal-add-item" class="modal hidden">
    <div class="collection-search-modal">
        <div class="collection-search-header">
            <h2>Añadir a la colección</h2>
            <input type="text" class="collection-search-input" id="collection-search-input" placeholder="Buscar álbum, película o serie…">
        </div>
        <div class="collection-search-results" id="collection-search-results"></div>
        <div class="collection-search-footer">
            <button id="btn-cancel-add-item" style="background:var(--bg-secondary); color:var(--text-main); border:1px solid var(--border-color); padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;">Cerrar</button>
        </div>
    </div>
</div>

<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="collections.js"></script>
</body>
</html>
