<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Colecciones</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <style>
        /* ── COLLECTIONS LIST ── */
        .collections-hero {
            padding: 60px 20px 40px;
            max-width: 1400px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 1px solid var(--border-color); margin-bottom: 48px;
        }
        .collections-hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 6px;
        }
        .collections-hero p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px; max-width: 1400px; margin: 0 auto; padding: 0 20px 60px;
        }

        /* ── COLLECTION CARD ── */
        .collection-card {
            border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border-color); background: white;
            box-shadow: var(--shadow-subtle); cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; position: relative;
            animation: fadeUp 0.4s ease both;
        }
        .collection-card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

        .collection-collage { height: 200px; position: relative; overflow: hidden; }
        .collage-img { position: absolute; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .collection-collage-empty { height: 200px; display: flex; align-items: center; justify-content: center; }

        .collection-card-info { padding: 16px 18px 18px; }
        .collection-card-name { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .collection-card-quote { font-size: 0.82rem; color: var(--text-muted); font-style: italic; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .collection-card-footer { display: flex; justify-content: space-between; align-items: center; }
        .collection-card-count { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .collection-fav-star { font-size: 1rem; cursor: pointer; transition: transform 0.2s; background: none; border: none; padding: 0; line-height: 1; }
        .collection-fav-star:hover { transform: scale(1.2); }
        .collection-card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .collection-card:hover .collection-card-actions { opacity: 1; }

        /* ── DETAIL ── */
        #view-detail { display: none; }

        .collection-detail-banner-wrap { max-width: 1400px; margin: 20px auto 0; padding: 0 20px; }
        .collection-detail-banner-inner {
            width: 100%; height: 280px; background: #1a1a1a;
            background-size: cover; background-position: center;
            position: relative; border-radius: 20px; overflow: hidden;
        }
        .collection-detail-banner-inner::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
        }
        .collection-banner-change-btn {
            position: absolute; top: 12px; right: 12px; z-index: 4;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            color: white; border: none; border-radius: 8px;
            padding: 6px 12px; font-size: 0.72rem; font-weight: 700;
            cursor: pointer; font-family: 'Inter', sans-serif;
            opacity: 0; transition: opacity 0.2s;
        }
        .collection-detail-banner-inner:hover .collection-banner-change-btn { opacity: 1; }
        .collection-detail-hero-content {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 0 32px 24px; z-index: 2;
        }
        .collection-detail-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.8rem; font-weight: 900; letter-spacing: -1.5px;
            color: white; margin-bottom: 6px; line-height: 1.1;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .collection-detail-quote-display {
            font-size: 1rem; color: rgba(255,255,255,0.8);
            font-style: italic; max-width: 600px; line-height: 1.5;
        }

        .collection-detail-actions {
            max-width: 1400px; margin: 20px auto 0; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
        }

        /* ── MASONRY ── */
        .collection-masonry {
            columns: 4; column-gap: 16px;
            max-width: 1400px; margin: 24px auto 0; padding: 0 20px 60px;
        }
        @media (max-width: 1100px) { .collection-masonry { columns: 3; } }
        @media (max-width: 700px)  { .collection-masonry { columns: 2; } }

        /* ── ITEM FORMATS ── */
        .col-item {
            break-inside: avoid; margin-bottom: 16px;
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-color); background: white;
            box-shadow: var(--shadow-subtle); position: relative;
            transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
        }
        .col-item:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

        /* Format: cover-only */
        .col-item.fmt-cover img { width: 100%; display: block; }
        .col-item.fmt-cover .col-item-info { display: none; }

        /* Format: cover + title + rating */
        .col-item.fmt-title img { width: 100%; display: block; }
        .col-item.fmt-title .col-item-info { padding: 10px 12px 12px; }
        .col-item.fmt-title .col-item-artist { display: none; }

        /* Format: cover + title + artist + rating */
        .col-item.fmt-full img { width: 100%; display: block; }
        .col-item.fmt-full .col-item-info { padding: 10px 12px 12px; }

        /* Format: horizontal (small cover + text side by side) */
        .col-item.fmt-horizontal { display: flex; align-items: center; gap: 0; }
        .col-item.fmt-horizontal img { width: 80px; height: 80px; object-fit: cover; flex-shrink: 0; }
        .col-item.fmt-horizontal .col-item-info { padding: 10px 12px; flex: 1; min-width: 0; }

        /* Artist item */
        .col-item.fmt-artist { text-align: center; padding: 20px 16px; }
        .col-item.fmt-artist img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: block; }
        .col-item.fmt-artist .col-item-artist-initials {
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 900; color: white;
        }

        .col-item-title { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .col-item-artist { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .col-item-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; color: white; margin-top: 4px; }

        /* ── FORMAT SELECTOR ── */
        .col-item-overlay {
            position: absolute; inset: 0; border-radius: 14px;
            background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s; z-index: 20;
            flex-direction: column; gap: 10px;
        }
        .col-item:hover .col-item-overlay { opacity: 1; }

        .col-item-overlay-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        .fmt-btn {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
            border: 1.5px solid rgba(255,255,255,0.3); border-radius: 8px;
            padding: 6px 10px; cursor: pointer; color: white;
            font-family: 'Inter', sans-serif; font-size: 0.68rem; font-weight: 700;
            transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .fmt-btn:hover, .fmt-btn.active {
            background: white; color: var(--text-main);
            border-color: white;
        }
        .fmt-btn svg { width: 16px; height: 16px; }

        .col-item-overlay-remove {
            background: rgba(230,57,70,0.8); border: none; border-radius: 6px;
            color: white; font-size: 0.7rem; font-weight: 700;
            padding: 4px 10px; cursor: pointer; font-family: 'Inter', sans-serif;
        }

        /* Color dot */
        .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.15s; flex-shrink: 0; }
        .color-dot:hover { transform: scale(1.2); }
        .color-dot.selected { border-color: white; transform: scale(1.15); box-shadow: 0 0 0 2px rgba(0,0,0,0.3); }

        /* Search modal */
        .collection-search-modal { background: white; border-radius: 20px; width: 100%; max-width: 560px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalFadeIn 0.3s ease; overflow: hidden; }
        @keyframes modalFadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .collection-search-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .collection-search-header h2 { font-size: 1.3rem; font-weight: 900; margin-bottom: 12px; }
        .collection-search-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-tab { padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border-color); background: white; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
        .search-tab.active { background: var(--text-main); border-color: var(--text-main); color: white; }
        .collection-search-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-secondary); font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--text-main); }
        .collection-search-input:focus { border-color: var(--accent-red); outline: none; }
        .collection-search-results { flex: 1; overflow-y: auto; padding: 8px; }
        .collection-search-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
        .collection-search-item:hover { background: var(--bg-secondary); }
        .collection-search-item.added { opacity: 0.4; pointer-events: none; }
        .collection-search-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .collection-search-item-initials { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; font-size: 1rem; flex-shrink: 0; }
        .collection-search-item-info { flex: 1; min-width: 0; }
        .collection-search-item-title { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .collection-search-item-meta { font-size: 0.75rem; color: var(--text-muted); }
        .collection-search-item-type { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); flex-shrink: 0; }
        .collection-search-footer { padding: 12px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; flex-shrink: 0; }

        #btn-cancel-collection { background: var(--bg-secondary); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.95rem; transition: background 0.2s; }
        #btn-cancel-collection:hover { background: #e0e0e0; }

        @media (max-width: 600px) {
            .collections-hero { flex-direction: column; align-items: flex-start; gap: 16px; }
            .collections-hero h1 { font-size: 2.5rem; }
            .collections-grid { grid-template-columns: 1fr; }
            .collection-detail-name { font-size: 2rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger active">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html">Películas</a>
                <a href="series.html">Series</a>
                <a href="music.html">Music</a>
                <a href="collections.html" class="active">Colecciones</a>
            </div>
        </div>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main style="padding:0;">

    <!-- VISTA: LISTA -->
    <div id="view-list">
        <div class="collections-hero">
            <div>
                <h1>Colecciones</h1>
                <p>Agrupa tus favoritos en colecciones temáticas</p>
            </div>
            <button class="save-btn" id="btn-new-collection">+ Nueva colección</button>
        </div>
        <div class="collections-grid" id="collections-grid"></div>
    </div>

    <!-- VISTA: DETALLE -->
    <div id="view-detail">
        <div class="collection-detail-banner-wrap">
            <div class="collection-detail-banner-inner" id="detail-banner">
                <button class="collection-banner-change-btn" id="btn-change-banner">Cambiar banner</button>
                <div class="collection-detail-hero-content">
                    <div class="collection-detail-name" id="detail-name">Colección</div>
                    <div class="collection-detail-quote-display" id="detail-quote-display"></div>
                </div>
            </div>
        </div>
        <input type="file" id="input-banner" accept="image/*" style="display:none;">

        <div class="collection-detail-actions">
            <button onclick="backToList()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:0.88rem;font-weight:700;font-family:'Inter',sans-serif;padding:0;display:flex;align-items:center;gap:4px;transition:color 0.2s;" onmouseover="this.style.color='var(--accent-red)'" onmouseout="this.style.color='var(--text-muted)'">← Volver</button>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="album-review-btn" id="btn-add-to-collection">+ Añadir</button>
                <button class="album-review-btn" id="btn-edit-collection">✎ Editar</button>
            </div>
        </div>

        <div class="collection-masonry" id="detail-grid"></div>
    </div>

</main>

<!-- MODAL: NUEVA/EDITAR COLECCIÓN -->
<div id="modal-collection" class="modal hidden">
    <div class="modal-content" style="max-width:480px;">
        <h2 id="collection-modal-title">Nueva colección</h2>
        <form id="collection-form">
            <label>Nombre:</label>
            <input type="text" id="collection-name" required placeholder="Ej: Películas de lluvia">
            <label>Frase (opcional):</label>
            <input type="text" id="collection-quote" placeholder="Ej: Las que me salvaron el verano de 2023">
            <label>Color de acento:</label>
            <div id="color-picker" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;padding:4px 0;"></div>
            <div class="modal-actions">
                <button type="button" id="btn-cancel-collection">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: BUSCAR PARA AÑADIR -->
<div id="modal-add-item" class="modal hidden">
    <div class="collection-search-modal">
        <div class="collection-search-header">
            <h2>Añadir a la colección</h2>
            <div class="collection-search-tabs">
                <button class="search-tab active" data-tab="all">Todo</button>
                <button class="search-tab" data-tab="album">Música</button>
                <button class="search-tab" data-tab="movie">Películas</button>
                <button class="search-tab" data-tab="series">Series</button>
                <button class="search-tab" data-tab="artist">Artistas</button>
            </div>
            <input type="text" class="collection-search-input" id="collection-search-input" placeholder="Buscar…">
        </div>
        <div class="collection-search-results" id="collection-search-results"></div>
        <div class="collection-search-footer">
            <button id="btn-cancel-add-item" style="background:var(--bg-secondary);color:var(--text-main);border:1px solid var(--border-color);padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;">Cerrar</button>
        </div>
    </div>
</div>

<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="collections.js"></script>
</body>
</html>
