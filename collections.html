<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Colecciones</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/collections.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main style="padding:0;">

    <!-- VISTA: LISTA -->
    <div id="view-list">
        <div class="collections-hero">
            <div>
                <h1>Colecciones</h1>
                <p>Agrupa tus favoritos en colecciones temáticas</p>
            </div>
            <button class="save-btn" id="btn-new-collection">+ Nueva colección</button>
        </div>
        <div class="collections-grid" id="collections-grid"></div>
    </div>

    <!-- VISTA: DETALLE -->
    <div id="view-detail">
        <div class="collection-detail-banner-wrap">
            <div class="collection-detail-banner-inner" id="detail-banner">
                <button class="collection-banner-change-btn" id="btn-change-banner">Cambiar banner</button>
                <div class="collection-detail-hero-content">
                    <div class="collection-detail-name" id="detail-name">Colección</div>
                    <div class="collection-detail-quote-display" id="detail-quote-display"></div>
                </div>
            </div>
        </div>
        <input type="file" id="input-banner" accept="image/*" style="display:none;">

        <div class="collection-detail-actions">
            <button onclick="backToList()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:0.88rem;font-weight:700;font-family:'Inter',sans-serif;padding:0;display:flex;align-items:center;gap:4px;transition:color 0.2s;" onmouseover="this.style.color='var(--accent-red)'" onmouseout="this.style.color='var(--text-muted)'">← Volver</button>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="album-review-btn" id="btn-add-to-collection">+ Añadir</button>
                <button class="album-review-btn" id="btn-edit-collection">✎ Editar</button>
            </div>
        </div>

        <div class="collection-masonry" id="detail-grid"></div>
    </div>

</main>

<!-- MODAL: NUEVA/EDITAR COLECCIÓN -->
<div id="modal-collection" class="modal hidden">
    <div class="modal-content" style="max-width:480px;">
        <h2 id="collection-modal-title">Nueva colección</h2>
        <form id="collection-form">
            <label>Nombre:</label>
            <input type="text" id="collection-name" required placeholder="Ej: Películas de lluvia">
            <label>Frase (opcional):</label>
            <input type="text" id="collection-quote" placeholder="Ej: Las que me salvaron el verano de 2023">
            <label>Color de acento:</label>
            <div id="color-picker" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;padding:4px 0;"></div>
            <div class="modal-actions">
                <button type="button" id="btn-cancel-collection">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: BUSCAR PARA AÑADIR -->
<div id="modal-add-item" class="modal hidden">
    <div class="collection-search-modal">
        <div class="collection-search-header">
            <h2>Añadir a la colección</h2>
            <div class="collection-search-tabs">
                <button class="search-tab active" data-tab="all">Todo</button>
                <button class="search-tab" data-tab="album">Música</button>
                <button class="search-tab" data-tab="movie">Películas</button>
                <button class="search-tab" data-tab="series">Series</button>
                <button class="search-tab" data-tab="artist">Artistas</button>
            </div>
            <input type="text" class="collection-search-input" id="collection-search-input" placeholder="Buscar…">
        </div>
        <div class="collection-search-results" id="collection-search-results"></div>
        <div class="collection-search-footer">
            <button id="btn-cancel-add-item" style="background:var(--bg-secondary);color:var(--text-main);border:1px solid var(--border-color);padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;">Cerrar</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/collections.js"></script>
</body>
</html>
