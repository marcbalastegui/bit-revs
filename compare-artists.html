<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Comparar Artistas</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/compare-artists.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div class="compare-hero">
        <h1>Comparar Artistas</h1>
        <p>Enfrenta dos artistas y compara sus estadísticas</p>
    </div>

    <div class="compare-selectors">
        <div class="album-selector" id="artist-selector-a">
            <span class="album-selector-label">Artista A</span>
            <input type="text" class="album-search-input" id="artist-search-a" placeholder="Buscar artista…" autocomplete="off">
            <div class="album-search-dropdown" id="artist-dropdown-a"></div>
        </div>
        <div class="compare-vs">VS</div>
        <div class="album-selector" id="artist-selector-b">
            <span class="album-selector-label">Artista B</span>
            <input type="text" class="album-search-input" id="artist-search-b" placeholder="Buscar artista…" autocomplete="off">
            <div class="album-search-dropdown" id="artist-dropdown-b"></div>
        </div>
    </div>

    <div id="compare-artists-results">
        <div class="compare-empty">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--border-color)" stroke-width="1.5" style="width:48px;height:48px;margin-bottom:12px;"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>
            <p>Busca dos artistas para compararlos</p>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/compare-artists.js"></script>
</body>
</html>
