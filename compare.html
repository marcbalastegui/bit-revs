<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Comparar Álbumes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/compare.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div class="compare-hero">
        <h1>Comparar Álbumes</h1>
        <p>Enfrenta dos álbumes y ve quién gana en cada categoría</p>
    </div>

    <div class="compare-selectors">
        <div class="album-selector" id="selector-a">
            <span class="album-selector-label">Álbum A</span>
            <input type="text" class="album-search-input" id="search-a" placeholder="Buscar álbum…" autocomplete="off">
            <div class="album-search-dropdown" id="dropdown-a"></div>
            <div class="album-preview" id="preview-a">
                <img id="preview-a-cover" src="" alt="">
                <div class="album-preview-info">
                    <div class="album-preview-title" id="preview-a-title"></div>
                    <div class="album-preview-meta" id="preview-a-meta"></div>
                </div>
                <button class="album-preview-clear" id="clear-a" title="Quitar selección">✕</button>
            </div>
        </div>

        <div class="compare-vs">VS</div>

        <div class="album-selector" id="selector-b">
            <span class="album-selector-label">Álbum B</span>
            <input type="text" class="album-search-input" id="search-b" placeholder="Buscar álbum…" autocomplete="off">
            <div class="album-search-dropdown" id="dropdown-b"></div>
            <div class="album-preview" id="preview-b">
                <img id="preview-b-cover" src="" alt="">
                <div class="album-preview-info">
                    <div class="album-preview-title" id="preview-b-title"></div>
                    <div class="album-preview-meta" id="preview-b-meta"></div>
                </div>
                <button class="album-preview-clear" id="clear-b" title="Quitar selección">✕</button>
            </div>
        </div>
    </div>

    <div id="compare-results">
        <div class="compare-empty">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;margin-bottom:12px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <p>Selecciona dos álbumes para compararlos</p>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/compare.js"></script>
</body>
</html>
