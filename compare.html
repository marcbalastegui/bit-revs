<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Comparar Álbumes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        .compare-hero {
            text-align: center;
            padding: 60px 20px 40px;
        }
        .compare-hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .compare-hero p { color: var(--text-muted); font-size: 1rem; margin: 0; }

        .compare-selectors {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: start;
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .compare-vs {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-muted);
            text-align: center;
            padding-top: 40px;
        }
        .album-selector {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-subtle);
            position: relative;
        }
        .album-selector-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .album-search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .album-search-input:focus {
            border-color: var(--accent-red);
            outline: none;
            background: white;
        }
        .album-search-dropdown {
            position: absolute;
            top: calc(100% - 8px);
            left: 0; right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            z-index: 200;
            max-height: 260px;
            overflow-y: auto;
            display: none;
        }
        .album-search-dropdown.open { display: block; }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid var(--border-color);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: var(--bg-secondary); }
        .dropdown-item.selected { background: rgba(230,57,70,0.06); }
        .dropdown-item img {
            width: 36px; height: 36px;
            border-radius: 4px; object-fit: cover; flex-shrink: 0;
        }
        .dropdown-item-info { min-width: 0; }
        .dropdown-item-title {
            font-size: 0.88rem; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dropdown-item-meta { font-size: 0.72rem; color: var(--text-muted); }
        .dropdown-empty { padding: 16px 14px; color: var(--text-muted); font-size: 0.85rem; text-align: center; }

        .album-preview {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        .album-preview.visible { display: flex; }
        .album-preview img {
            width: 44px; height: 44px;
            border-radius: 6px; object-fit: cover; flex-shrink: 0;
        }
        .album-preview-info { min-width: 0; flex: 1; }
        .album-preview-title { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-preview-meta { font-size: 0.75rem; color: var(--text-muted); }
        .album-preview-clear {
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); font-size: 1rem; padding: 4px;
            transition: color 0.2s; flex-shrink: 0;
        }
        .album-preview-clear:hover { color: var(--accent-red); }

        #compare-results { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
        .compare-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }

        @media (max-width: 700px) {
            .compare-selectors { grid-template-columns: 1fr; }
            .compare-vs { display: none; }
            .compare-hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html">Películas</a>
                <a href="series.html">Series</a>
                <a href="music.html" class="active">Music</a>
                <a href="collections.html">Colecciones</a>
            </div>
        </div>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <div class="compare-hero">
        <h1>Comparar Álbumes</h1>
        <p>Enfrenta dos álbumes y ve quién gana en cada categoría</p>
    </div>

    <div class="compare-selectors">
        <div class="album-selector" id="selector-a">
            <span class="album-selector-label">Álbum A</span>
            <input type="text" class="album-search-input" id="search-a" placeholder="Buscar álbum…" autocomplete="off">
            <div class="album-search-dropdown" id="dropdown-a"></div>
            <div class="album-preview" id="preview-a">
                <img id="preview-a-cover" src="" alt="">
                <div class="album-preview-info">
                    <div class="album-preview-title" id="preview-a-title"></div>
                    <div class="album-preview-meta" id="preview-a-meta"></div>
                </div>
                <button class="album-preview-clear" id="clear-a" title="Quitar selección">✕</button>
            </div>
        </div>

        <div class="compare-vs">VS</div>

        <div class="album-selector" id="selector-b">
            <span class="album-selector-label">Álbum B</span>
            <input type="text" class="album-search-input" id="search-b" placeholder="Buscar álbum…" autocomplete="off">
            <div class="album-search-dropdown" id="dropdown-b"></div>
            <div class="album-preview" id="preview-b">
                <img id="preview-b-cover" src="" alt="">
                <div class="album-preview-info">
                    <div class="album-preview-title" id="preview-b-title"></div>
                    <div class="album-preview-meta" id="preview-b-meta"></div>
                </div>
                <button class="album-preview-clear" id="clear-b" title="Quitar selección">✕</button>
            </div>
        </div>
    </div>

    <div id="compare-results">
        <div class="compare-empty">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;margin-bottom:12px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <p>Selecciona dos álbumes para compararlos</p>
        </div>
    </div>
</main>

<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="compare.js"></script>
</body>
</html>
