<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Comparar Álbumes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        .compare-hero {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .compare-hero h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .compare-hero p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }

        .compare-selectors {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .compare-vs {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-muted);
            text-align: center;
        }

        .album-selector {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-subtle);
        }

        .album-selector label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .album-selector select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .album-selector select:focus {
            border-color: var(--accent-red);
            outline: none;
        }

        .album-preview {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 10px;
        }

        .album-preview.visible { display: flex; }

        .album-preview img {
            width: 44px; height: 44px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .album-preview-info { min-width: 0; }

        .album-preview-title {
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-preview-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #compare-results {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .compare-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        @media (max-width: 700px) {
            .compare-selectors { grid-template-columns: 1fr; }
            .compare-vs { display: none; }
            .compare-hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="index.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="movies.html">Películas</a>
        <a href="series.html">Series</a>
        <a href="index.html">Álbumes</a>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <div class="compare-hero">
        <h1>Comparar Álbumes</h1>
        <p>Enfrenta dos álbumes y ve quién gana en cada categoría</p>
    </div>

    <div class="compare-selectors">
        <div class="album-selector">
            <label>Álbum A</label>
            <select id="select-album-a">
                <option value="">Selecciona un álbum…</option>
            </select>
            <div class="album-preview" id="preview-a">
                <img id="preview-a-cover" src="" alt="">
                <div class="album-preview-info">
                    <div class="album-preview-title" id="preview-a-title"></div>
                    <div class="album-preview-meta" id="preview-a-meta"></div>
                </div>
            </div>
        </div>

        <div class="compare-vs">VS</div>

        <div class="album-selector">
            <label>Álbum B</label>
            <select id="select-album-b">
                <option value="">Selecciona un álbum…</option>
            </select>
            <div class="album-preview" id="preview-b">
                <img id="preview-b-cover" src="" alt="">
                <div class="album-preview-info">
                    <div class="album-preview-title" id="preview-b-title"></div>
                    <div class="album-preview-meta" id="preview-b-meta"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="compare-results">
        <div class="compare-empty">
            <p style="font-size:1.5rem;">🎵</p>
            <p>Selecciona dos álbumes para compararlos</p>
        </div>
    </div>
</main>

<script src="db.js"></script>
<script src="compare.js"></script>
</body>
</html>
