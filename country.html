<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - País</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/country.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <!-- Hero con bandera -->
    <div class="country-hero">
        <img id="country-flag-img" class="country-flag-img" src="" alt="">
        <div class="country-hero-text">
            <div class="country-hero-label">País de origen</div>
            <h1 class="country-hero-title" id="country-name">—</h1>
            <div class="country-hero-meta" id="country-meta"></div>
        </div>
    </div>

    <!-- Stats rápidas -->
    <div class="country-stats" id="country-stats"></div>

    <!-- Mejor película -->
    <div class="country-best-section" id="country-best-section" style="display:none;">
        <div class="country-section-title">Mejor película</div>
        <div id="country-best-card"></div>
    </div>

    <!-- Todas las películas -->
    <div class="country-movies-section">
        <div class="country-section-title" id="movies-section-title">Películas</div>
        <div class="country-movie-grid" id="country-movies-grid"></div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/country.js"></script>
</body>
</html>
