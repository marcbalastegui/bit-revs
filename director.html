
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Director</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/director.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <!-- Hero con foto -->
    <div class="director-hero">
        <div class="director-photo-wrap">
            <div class="director-photo">
                <img id="director-photo-img" src="" alt="">
                <span id="director-initial">?</span>
            </div>
            <button class="director-photo-btn" id="director-photo-btn">Añadir foto</button>
            <input type="file" id="director-photo-input" accept="image/*" style="display:none;">
        </div>
        <div class="director-hero-info">
            <div class="director-hero-label">Director</div>
            <h1 class="director-hero-title" id="director-name">—</h1>
            <div class="director-hero-meta" id="director-meta"></div>
        </div>
    </div>

    <!-- Stats -->
    <div class="director-stats" id="director-stats"></div>

    <!-- Mejor película -->
    <div class="director-best-section" id="director-best-section" style="display:none;">
        <div class="dir-section-title">Top películas</div>
        <div id="director-best-card"></div>
    </div>

    <!-- Resto de películas -->
    <div class="director-movies-section">
        <div class="dir-section-title" id="dir-movies-title">Películas</div>
        <div class="director-movies-grid" id="director-movies-grid"></div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/director.js"></script>
</body>
</html>
