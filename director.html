<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Director</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── HERO ──────────────────────────────────────────────────────── */
        .director-hero {
            display: flex;
            align-items: flex-end;
            gap: 36px;
            padding: 48px 0 40px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .director-photo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .director-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #director-photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #director-initial {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-muted);
            user-select: none;
        }

        .director-photo-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .director-photo-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .director-hero-info { flex: 1; min-width: 0; }

        .director-hero-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        .director-hero-title {
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--text-main);
            margin: 0 0 8px;
        }

        .director-hero-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        @media (max-width: 540px) {
            .director-hero { flex-direction: column; align-items: flex-start; gap: 20px; }
            .director-photo { width: 90px; height: 90px; }
            #director-initial { font-size: 2rem; }
        }

        /* ── STATS ──────────────────────────────────────────────────────── */
        .director-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .dir-stat-box {
            flex: 1;
            min-width: 110px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 22px;
            transition: background 0.15s;
        }
        .dir-stat-box[onclick] { cursor: pointer; }
        .dir-stat-box[onclick]:hover { background: var(--bg-secondary); }

        .dir-stat-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .dir-stat-value {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-main);
            line-height: 1.1;
        }

        /* ── MEJOR PELÍCULA ─────────────────────────────────────────────── */
        .director-best-section { margin-bottom: 40px; }

        .dir-section-title {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: -0.3px;
            margin-bottom: 18px;
        }

        .dir-best-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 20px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.15s;
            max-width: 520px;
        }
        .dir-best-card:hover { background: var(--bg-secondary); }

        .dir-best-cover {
            width: 56px;
            height: 84px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .dir-best-info { flex: 1; min-width: 0; }

        .dir-best-title {
            font-size: 1.05rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dir-best-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .dir-best-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 900;
            color: white;
            flex-shrink: 0;
        }

        /* ── GRID DE PELÍCULAS ──────────────────────────────────────────── */
        .director-movies-section { margin-bottom: 56px; }

        .director-movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
        }

        .dir-movie-card {
            border-radius: 12px;
            background: white;
            border: 1px solid var(--border-color);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .dir-movie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .dir-movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .dir-movie-info { padding: 10px 12px; }
        .dir-movie-title {
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .dir-movie-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .dir-movie-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 900;
            color: white;
        }

        .dir-empty {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger active">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html" class="active">Películas</a>
                <a href="series.html">Series</a>
                <a href="music.html">Music</a>
                <a href="collections.html">Colecciones</a>
            </div>
        </div>
        <a href="top.html">Top</a>
        <a href="wrapped.html">Wrapped</a>
        <a href="lists.html">Listas</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <!-- Hero con foto -->
    <div class="director-hero">
        <div class="director-photo-wrap">
            <div class="director-photo">
                <img id="director-photo-img" src="" alt="">
                <span id="director-initial">?</span>
            </div>
            <button class="director-photo-btn" id="director-photo-btn">Añadir foto</button>
            <input type="file" id="director-photo-input" accept="image/*" style="display:none;">
        </div>
        <div class="director-hero-info">
            <div class="director-hero-label">Director</div>
            <h1 class="director-hero-title" id="director-name">—</h1>
            <div class="director-hero-meta" id="director-meta"></div>
        </div>
    </div>

    <!-- Stats -->
    <div class="director-stats" id="director-stats"></div>

    <!-- Mejor película -->
    <div class="director-best-section" id="director-best-section" style="display:none;">
        <div class="dir-section-title">Mejor película</div>
        <div id="director-best-card"></div>
    </div>

    <!-- Resto de películas -->
    <div class="director-movies-section">
        <div class="dir-section-title" id="dir-movies-title">Películas</div>
        <div class="director-movies-grid" id="director-movies-grid"></div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="firebase-config.js"></script>

<script src="director.js"></script>
</body>
</html>
