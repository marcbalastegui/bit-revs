<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Género</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/genre.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div class="genre-hero">
        <div class="genre-hero-label">Género</div>
        <h1 class="genre-hero-title" id="genre-title">—</h1>
        <div class="genre-hero-meta" id="genre-meta"></div>
    </div>

    <!-- Mejores álbumes! -->
    <div class="genre-section" id="section-best">
        <div class="genre-section-header">
            <span class="genre-section-title">Mejores álbumes</span>
            <a href="music.html" class="home-section-link" style="font-size:0.82rem; font-weight:700; color:var(--accent-red); text-decoration:none;">Ver todos →</a>
        </div>
        <div class="genre-album-grid" id="grid-best-albums"></div>
    </div>

    <!-- Listas con este género -->
    <div class="genre-section" id="section-lists">
        <div class="genre-section-header">
            <span class="genre-section-title">Listas con este género</span>
        </div>
        <div id="grid-lists"></div>
    </div>

    <!-- Top canciones -->
    <div class="genre-section" id="section-tracks">
        <div class="genre-section-header">
            <span class="genre-section-title">Mejores canciones</span>
        </div>
        <div id="grid-tracks"></div>
    </div>

    <!-- Todo (colapsable) -->
    <div class="genre-section" id="section-all">
        <div class="genre-todo-header" id="todo-toggle">
            <span class="genre-section-title">Todo</span>
            <span class="genre-todo-chevron" id="todo-chevron">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
        </div>
        <div class="genre-todo-body" id="todo-body">
            <div class="genre-todo-grid" id="grid-all-albums"></div>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/genre.js"></script>
</body>
</html>
