<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Mis Listas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/lists.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div style="max-width:1100px; margin:0 auto; padding:0 20px 24px; display:flex; justify-content:space-between; align-items:center;">
        <h1>Mis Listas</h1>
        <button class="save-btn" id="btn-new-list">+ Nueva lista</button>
    </div>
    <div class="lists-layout">
        <div class="lists-panel">
            <div class="lists-panel-header">
                <h3>Listas</h3>
            </div>
            <div id="lists-sidebar"></div>
        </div>
        <div id="list-detail"></div>
    </div>
</main>

<!-- Modal nueva/editar lista -->
<div id="list-modal" class="modal hidden">
    <div class="modal-content">
        <h2 id="list-modal-title">Nueva lista</h2>
        <form id="list-modal-form">
            <label>Nombre:</label>
            <input type="text" id="list-modal-name" required placeholder="Ej: Top 10 álbumes de mi vida">
            <label>Descripción (opcional):</label>
            <input type="text" id="list-modal-desc" placeholder="Ej: Los mejores discos que he escuchado">
            <label>Tipo de elementos:</label>
            <div style="display:flex; gap:10px; margin-bottom:4px;">
                <label style="display:flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;">
                    <input type="radio" name="list-item-type" id="list-type-albums" value="album" checked style="width:auto;"> Álbumes
                </label>
                <label style="display:flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;">
                    <input type="radio" name="list-item-type" id="list-type-tracks" value="track" style="width:auto;"> Canciones
                </label>
            </div>
            <label>Género (opcional):</label>
            <input type="text" id="list-modal-genre" placeholder="Ej: R&B/Soul" list="genre-datalist" autocomplete="off">
            <datalist id="genre-datalist"></datalist>
            <div style="display:flex; align-items:center; gap:10px; margin:12px 0 4px;">
                <input type="checkbox" id="list-modal-istop" style="width:auto; margin:0;">
                <label for="list-modal-istop" style="margin:0; font-weight:700; cursor:pointer;">Lista tipo "Top" <span style="font-size:0.75rem; color:var(--text-muted); font-weight:500;">(afecta al desempate en rankings)</span></label>
            </div>
            <div class="modal-actions">
                <button type="button" id="list-modal-cancel">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal añadir elemento -->
<div id="add-item-modal" class="modal hidden">
    <div class="modal-content" style="max-width:560px;">
        <h2>Añadir a la lista</h2>
        <input type="text" id="add-item-search" placeholder="Buscar álbum, película o serie…" style="margin-bottom:10px;">
        <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
            <select id="add-item-type" style="flex:1; min-width:120px; padding:7px 10px; border-radius:8px; border:1px solid var(--border-color); font-family:'Inter',sans-serif; font-size:0.82rem; font-weight:600; background:var(--bg-secondary); color:var(--text-main); cursor:pointer;">
                <option value="">Todo</option>
                <option value="album">Álbumes</option>
                <option value="movie">Películas</option>
                <option value="series">Series</option>
            </select>
            <select id="add-item-sort" style="flex:1; min-width:150px; padding:7px 10px; border-radius:8px; border:1px solid var(--border-color); font-family:'Inter',sans-serif; font-size:0.82rem; font-weight:600; background:var(--bg-secondary); color:var(--text-main); cursor:pointer;">
                <option value="default">Orden por defecto</option>
                <option value="rating-desc">Nota (Mayor a Menor)</option>
                <option value="rating-asc">Nota (Menor a Mayor)</option>
                <option value="year-desc">Año (Más reciente)</option>
                <option value="year-asc">Año (Más antiguo)</option>
                <option value="title-asc">Título (A-Z)</option>
                <option value="artist-asc">Artista (A-Z)</option>
            </select>
        </div>
        <div id="add-item-results" style="max-height:360px; overflow-y:auto;"></div>
        <div class="modal-actions">
            <button type="button" id="add-item-cancel">Cerrar</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/lists.js"></script>
</body>
</html>
