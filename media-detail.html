<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Detalle</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/media-detail.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div id="media-detail-container">
        <p style="color:var(--text-muted);">Cargando…</p>
    </div>
</main>

<!-- MODAL AÑADIR ESCENA -->
<div id="modal-scene" class="modal hidden">
    <div class="scene-modal-content">
        <h2 id="scene-modal-title" style="font-size:1.5rem; font-weight:900; margin-bottom:20px; letter-spacing:-0.5px;">Nueva Escena</h2>

        <!-- Tipo de escena -->
        <div class="scene-type-selector">
            <button class="scene-type-btn active" id="btn-type-quote" onclick="setSceneType('quote')">
                ❝ Cita
            </button>
            <button class="scene-type-btn" id="btn-type-frame" onclick="setSceneType('frame')">
                ▣ Fotograma
            </button>
        </div>

        <!-- Sección CITA -->
        <div id="scene-quote-section">
            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:8px;">Tipografía</label>
            <div class="scene-font-selector" id="font-selector">
                <button class="scene-font-btn active" data-font="Playfair Display">Playfair</button>
                <button class="scene-font-btn" data-font="Cormorant Garamond">Cormorant</button>
                <button class="scene-font-btn" data-font="DM Serif Display">DM Serif</button>
                <button class="scene-font-btn" data-font="Inter">Sans</button>
            </div>

            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:16px 0 8px;">Texto de la cita</label>
            <textarea id="scene-quote-text" rows="3" placeholder="Escribe la cita aquí…"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.95rem; resize:vertical; color:var(--text-main);"></textarea>

            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:12px 0 8px;">Subtítulo / atribución (opcional)</label>
            <input type="text" id="scene-quote-sub" placeholder="Ej: — Personaje, Cap. 3"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-main);">

            <!-- Preview -->
            <div class="quote-preview" id="quote-preview">
                <div class="quote-preview-text" id="quote-preview-text" style="font-family:'Playfair Display',serif;">La cita aparecerá aquí…</div>
                <div class="quote-preview-sub" id="quote-preview-sub"></div>
            </div>
        </div>

        <!-- Sección FOTOGRAMA -->
        <div id="scene-frame-section" style="display:none;">
            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:8px;">Imagen</label>
            <input type="file" id="scene-frame-file" accept="image/*"
                style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.88rem; cursor:pointer;">

            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:14px 0 8px;">Texto / Subtítulo (opcional)</label>
            <input type="text" id="scene-frame-subtitle" placeholder="Texto que aparecerá sobre la imagen…"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-main);">

            <!-- Preview -->
            <div class="frame-preview" id="frame-preview">
                <div class="frame-upload-placeholder">Selecciona una imagen para previsualizarla</div>
            </div>
        </div>

        <div class="modal-actions" style="margin-top:24px;">
            <button type="button" id="btn-cancel-scene" style="background:var(--bg-secondary); color:var(--text-main); border:1px solid var(--border-color); padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; font-size:0.95rem; transition:background 0.2s;">Cancelar</button>
            <button type="button" id="btn-save-scene" class="save-btn">Guardar Escena</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/media-detail.js"></script>
</body>
</html>
