<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Detalle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ── MEDIA DETAIL ── */
        .media-header-banner {
            display: flex;
            gap: 50px;
            align-items: flex-end;
            padding-bottom: 40px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .media-detail-cover {
            width: 220px;
            flex-shrink: 0;
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
            object-fit: cover;
        }

        .media-detail-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .media-detail-type {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .media-detail-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.5px;
        }

        .media-detail-meta {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .media-detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .media-detail-extra {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .media-detail-extra-row {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .media-detail-extra-row strong {
            color: var(--text-main);
            font-weight: 700;
        }

        /* ── ESCENAS SECTION ── */
        .scenes-section {
            max-width: 1100px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .scenes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .scenes-header h2 {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0;
        }

        .scenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* ── ESCENA CARD ── */
        .scene-card {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: white;
            box-shadow: var(--shadow-subtle);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: default;
        }

        .scene-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

        /* Cita */
        .scene-quote {
            padding: 32px 28px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .scene-quote-text {
            font-size: 1.3rem;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .scene-quote-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Fotograma */
        .scene-frame {
            position: relative;
            width: 100%;
        }

        .scene-frame img {
            width: 100%;
            display: block;
            max-height: 280px;
            object-fit: cover;
        }

        .scene-frame-subtitle {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 16px 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            color: white;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            font-weight: 400;
            line-height: 1.3;
            text-align: center;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            letter-spacing: 0.5px;
        }

        /* Acciones de cada escena */
        .scene-card-actions {
            position: absolute;
            top: 8px; right: 8px;
            display: flex; gap: 6px;
            opacity: 0; transition: opacity 0.2s;
        }
        .scene-card:hover .scene-card-actions { opacity: 1; }

        /* ── MODAL ESCENA ── */
        .scene-modal-content {
            background: var(--bg-primary);
            border-radius: 20px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalFadeIn 0.3s ease;
            padding: 36px;
        }

        .scene-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .scene-type-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .scene-type-btn.active {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: rgba(230,57,70,0.06);
        }

        .scene-font-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .scene-font-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            transition: all 0.15s;
        }
        .scene-font-btn.active {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
        .scene-font-btn[data-font="Playfair Display"] { font-family: 'Playfair Display', serif; }
        .scene-font-btn[data-font="Cormorant Garamond"] { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
        .scene-font-btn[data-font="DM Serif Display"] { font-family: 'DM Serif Display', serif; }
        .scene-font-btn[data-font="Inter"] { font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 700; }

        /* Preview de cita en el modal */
        .quote-preview {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 20px;
            margin-top: 12px;
            min-height: 80px;
            display: flex; flex-direction: column; justify-content: center;
            border: 1px solid var(--border-color);
        }

        .quote-preview-text {
            font-size: 1.2rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        .quote-preview-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Frame preview */
        .frame-preview {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
            background: #111;
            min-height: 80px;
            display: flex; align-items: center; justify-content: center;
        }

        .frame-preview img {
            width: 100%; display: block; max-height: 240px; object-fit: cover;
        }

        .frame-preview-subtitle {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 12px 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            color: white;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            font-weight: 400;
            text-align: center;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            letter-spacing: 0.5px;
        }

        .frame-upload-placeholder {
            color: var(--text-muted);
            font-size: 0.88rem;
            text-align: center;
            padding: 20px;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Grid size buttons */
        .grid-size-btn {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: white;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            letter-spacing: 1px;
        }
        .grid-size-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }
        .grid-size-btn.active {
            background: var(--text-main);
            border-color: var(--text-main);
            color: white;
        }

        @media (max-width: 700px) {
            .media-header-banner { flex-direction: column; gap: 20px; }
            .media-detail-cover  { width: 100%; max-width: 200px; }
            .media-detail-title  { font-size: 2.2rem; }
            .scenes-grid         { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger active">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html">Películas</a>
                <a href="series.html">Series</a>
                <a href="music.html">Music</a>
                <a href="collections.html">Colecciones</a>
            </div>
        </div>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
        <a href="lists.html">Listas</a>
    </nav>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <div id="media-detail-container">
        <p style="color:var(--text-muted);">Cargando…</p>
    </div>
</main>

<!-- MODAL AÑADIR ESCENA -->
<div id="modal-scene" class="modal hidden">
    <div class="scene-modal-content">
        <h2 id="scene-modal-title" style="font-size:1.5rem; font-weight:900; margin-bottom:20px; letter-spacing:-0.5px;">Nueva Escena</h2>

        <!-- Tipo de escena -->
        <div class="scene-type-selector">
            <button class="scene-type-btn active" id="btn-type-quote" onclick="setSceneType('quote')">
                ❝ Cita
            </button>
            <button class="scene-type-btn" id="btn-type-frame" onclick="setSceneType('frame')">
                ▣ Fotograma
            </button>
        </div>

        <!-- Sección CITA -->
        <div id="scene-quote-section">
            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:8px;">Tipografía</label>
            <div class="scene-font-selector" id="font-selector">
                <button class="scene-font-btn active" data-font="Playfair Display">Playfair</button>
                <button class="scene-font-btn" data-font="Cormorant Garamond">Cormorant</button>
                <button class="scene-font-btn" data-font="DM Serif Display">DM Serif</button>
                <button class="scene-font-btn" data-font="Inter">Sans</button>
            </div>

            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:16px 0 8px;">Texto de la cita</label>
            <textarea id="scene-quote-text" rows="3" placeholder="Escribe la cita aquí…"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.95rem; resize:vertical; color:var(--text-main);"></textarea>

            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:12px 0 8px;">Subtítulo / atribución (opcional)</label>
            <input type="text" id="scene-quote-sub" placeholder="Ej: — Personaje, Cap. 3"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-main);">

            <!-- Preview -->
            <div class="quote-preview" id="quote-preview">
                <div class="quote-preview-text" id="quote-preview-text" style="font-family:'Playfair Display',serif;">La cita aparecerá aquí…</div>
                <div class="quote-preview-sub" id="quote-preview-sub"></div>
            </div>
        </div>

        <!-- Sección FOTOGRAMA -->
        <div id="scene-frame-section" style="display:none;">
            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:8px;">Imagen</label>
            <input type="file" id="scene-frame-file" accept="image/*"
                style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.88rem; cursor:pointer;">

            <label style="display:block; font-size:0.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:14px 0 8px;">Texto / Subtítulo (opcional)</label>
            <input type="text" id="scene-frame-subtitle" placeholder="Texto que aparecerá sobre la imagen…"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-main);">

            <!-- Preview -->
            <div class="frame-preview" id="frame-preview">
                <div class="frame-upload-placeholder">Selecciona una imagen para previsualizarla</div>
            </div>
        </div>

        <div class="modal-actions" style="margin-top:24px;">
            <button type="button" id="btn-cancel-scene" style="background:var(--bg-secondary); color:var(--text-main); border:1px solid var(--border-color); padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; font-size:0.95rem; transition:background 0.2s;">Cancelar</button>
            <button type="button" id="btn-save-scene" class="save-btn">Guardar Escena</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="media-detail.js"></script>
</body>
</html>
