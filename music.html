<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Music</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <button type="button" id="spotify-connect-btn" class="spotify-connect-btn" title="Conectar Spotify">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M7.5 10.3c3-1 6.2-1 9.2.2"/>
                <path d="M8 13.4c2.5-.8 5-.8 7.4.1"/>
                <path d="M8.6 16.3c1.8-.5 3.6-.5 5.3.1"/>
            </svg>
        </button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div class="page-title-row">
        <h1>Música</h1>
        <div class="page-title-actions">
            <a href="compare.html" class="secondary-link-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Comparar álbumes
            </a>
            <button id="btn-add-album" class="save-btn">+ Añadir</button>
        </div>
    </div>

    <div class="controls-bar">
        <input type="text" id="filter-input" placeholder="Filtrar por artista o título...">
        <select id="sort-select">
            <option value="default">Orden por defecto</option>
            <option value="rating-desc">Nota (Mayor a Menor)</option>
            <option value="rating-asc">Nota (Menor a Mayor)</option>
            <option value="year-desc">Año (Más reciente)</option>
            <option value="year-asc">Año (Más antiguo)</option>
            <option value="title-asc">Título (A-Z)</option>
            <option value="artist-asc">Artista (A-Z)</option>
        </select>
        <select id="genre-filter">
            <option value="">Todos los géneros</option>
        </select>
    </div>

    <div class="type-filter-bar">
        <button type="button" class="type-filter-btn active" data-type="album">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="3.5"/>
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
            </svg>
            Álbumes
            <span class="type-count" id="count-album">—</span>
        </button>
        <button type="button" class="type-filter-btn" data-type="Single">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
            Singles
            <span class="type-count" id="count-single">—</span>
        </button>
        <button type="button" class="type-filter-btn" data-type="EP">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <rect x="2" y="2" width="20" height="20" rx="4"/>
                <circle cx="12" cy="12" r="3.5"/>
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
            </svg>
            EPs
            <span class="type-count" id="count-ep">—</span>
        </button>

        <div class="view-toggle" role="group" aria-label="Vista de la cuadrícula" data-grid="album-grid" data-setting="defaults.musicView">
            <button type="button" class="view-toggle-btn" data-view="mini" title="Mini-cuadrícula (solo portada y nota)" aria-label="Mini-cuadrícula">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                    <rect x="3" y="3" width="7.5" height="7.5" rx="2"/>
                    <rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
                    <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/>
                    <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
                </svg>
            </button>
            <button type="button" class="view-toggle-btn active" data-view="normal" title="Cuadrícula normal" aria-label="Cuadrícula normal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4"/>
                    <rect x="7.5" y="7.5" width="9" height="9" rx="2"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="album-grid" id="album-grid"></div>
</main>

<!-- MODAL AÑADIR/EDITAR -->
<div id="modal-add" class="modal hidden">
    <div class="modal-content">
        <h2>Nueva Reseña</h2>

        <div id="spotify-suggestions" class="spotify-suggestions hidden">
            <div class="spotify-suggestions-header">
                <div class="spotify-tabs">
                    <button type="button" class="spotify-tab active" data-tab="liked">Guardados</button>
                    <button type="button" class="spotify-tab" data-tab="recent">Recientes</button>
                </div>
            </div>
            <div class="spotify-type-tabs">
                <button type="button" class="spotify-type-tab active" data-type="album">Álbumes</button>
                <button type="button" class="spotify-type-tab" data-type="single">Sencillos</button>
            </div>
            <input type="text" id="spotify-search-input" class="spotify-search-input" placeholder="Buscar en Spotify...">
            <div id="spotify-suggestions-grid" class="spotify-suggestions-grid"></div>
            <div id="spotify-suggestions-status" class="spotify-suggestions-status"></div>
        </div>

        <form id="album-form">
            <label for="cover">Portada:</label>
            <input type="file" id="cover" accept="image/*" required>

            <label for="title">Título:</label>
            <input type="text" id="title" required placeholder="Ej: Graduation">

            <label for="artist">Artista Principal:</label>
            <input type="text" id="artist" required placeholder="Ej: Kanye West">

            <label for="featured-artists">Artistas Colaboradores (opcional):</label>
            <input type="text" id="featured-artists" placeholder="Ej: Kid Cudi, Pusha T">

            <label for="year">Año:</label>
            <input type="number" id="year" required placeholder="Ej: 2007">

            <label for="album-type">Tipo de lanzamiento:</label>
            <select id="album-type">
                <option value="">Estándar (Álbum)</option>
                <option value="Deluxe">Deluxe</option>
                <option value="EP">EP</option>
                <option value="Single">Single</option>
            </select>

            <label for="review-date">Fecha de puntuación:</label>
            <input type="date" id="review-date">

            <input type="hidden" id="rating" value="0">

            <label>Géneros:</label>
            <div id="genre-chips" class="genre-chips"></div>
            <input type="text" id="genre-custom" placeholder="Otro género (ej: Afrobeats, Drill…)" class="genre-custom-input">

            <div class="modal-actions">
                <button type="button" id="btn-cancel">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/spotify/spotify-auth.js"></script>
<script src="js/spotify/spotify-api.js"></script>
<script src="js/pages/music.js"></script>
</body>
</html>
