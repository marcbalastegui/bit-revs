<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Mi Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/profile.css">
    <script src="js/core/settings.js"></script>
</head>
<body>
    <header>
    <div class="header-right">
            <button style="visibility:hidden;" class="save-btn">+</button>
            <a href="profile.html" class="header-avatar active" id="global-header-avatar" title="Mi Perfil">U</a>
        </div>
    </header>
<script src="js/core/header.js"></script>

    <main>
        <!-- Hero card -->
        <div class="profile-hero-card" id="profile-layout">
            <div class="profile-banner" id="profile-banner-view">
                <div class="banner-edit-overlay hidden" id="banner-edit-overlay">Cambiar Banner</div>
            </div>

            <div class="profile-header-content">
                <div class="avatar-wrap" id="profile-avatar-view">
                    <div class="profile-avatar" id="avatar-circle">
                        <span id="avatar-fallback-char">U</span>
                    </div>
                    <div class="avatar-overlay hidden" id="avatar-edit-overlay">EDITAR</div>
                </div>

                <div class="profile-info">
                    <div class="profile-header-row">
                        <div style="flex:1; min-width:0;">
                            <h1 id="profile-name-view">Mi Perfil</h1>
                            <input type="text" id="profile-name-edit" class="profile-name-input hidden" placeholder="Tu nombre">
                        </div>
                        <button id="btn-edit-profile" class="edit-btn">Editar Perfil</button>
                    </div>
                    <p id="profile-bio-view" class="hidden"></p>
                    <textarea id="profile-bio-edit" class="profile-bio-edit hidden" placeholder="Escribe algo sobre ti..." maxlength="150" rows="2"></textarea>
                    <div class="accent-picker hidden" id="accent-picker">
                        <div class="accent-picker-label">Color de acento</div>
                        <div class="accent-swatches" id="accent-swatches"></div>
                    </div>
                </div>
            </div>

            <div id="edit-actions" class="edit-actions-bar hidden">
                <button id="btn-cancel-edit" class="edit-cancel-btn">Cancelar</button>
                <button id="btn-save-edit" class="save-btn">Guardar Cambios</button>
            </div>
        </div>

        <!-- Stat cards -->
        <div class="profile-stat-cards" id="profile-stat-cards"></div>

        <!-- Scroll sections -->
        <div class="profile-section" id="section-albums">
            <div class="profile-section-title">Mis mejores álbumes</div>
            <div class="profile-scroll-row" id="scroll-albums"></div>
        </div>

        <div class="profile-section" id="section-movies">
            <div class="profile-section-title">Películas mejor valoradas</div>
            <div class="profile-scroll-row" id="scroll-movies"></div>
        </div>

        <div class="profile-section" id="section-series">
            <div class="profile-section-title">Series mejor valoradas</div>
            <div class="profile-scroll-row" id="scroll-series"></div>
        </div>

        <!-- Activity -->
        <div class="profile-section">
            <div class="profile-section-title">Actividad reciente</div>
            <div id="activity-list"></div>
        </div>
    </main>

    <input type="file" id="input-avatar" accept="image/*" class="hidden">
    <input type="file" id="input-banner" accept="image/*" class="hidden">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/profile.js"></script>
</body>
</html>
