<style>
/* ── REVIEW MODAL ── */
.review-modal-content {
    background: var(--bg-primary);
    border-radius: 20px;
    width: 90vw;
    max-width: 780px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: modalFadeIn 0.3s ease;
    overflow: hidden;
}

.review-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
}

.review-modal-header h2 {
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.review-editor {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 0;
}

/* Wrapper de cada bloque */
.review-block-wrapper {
    position: relative;
}

/* Textarea base */
.review-block {
    width: 100%;
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    line-height: 1.7;
    resize: none;
    overflow: hidden;
    transition: border-color 0.2s, background 0.2s;
    min-height: 60px;
    color: var(--text-main);
}

.review-block:focus {
    outline: none;
    border-color: var(--accent-red);
}

/* Bloque de texto normal */
.review-block-text {
    background: var(--bg-secondary);
}

.review-block-text:focus {
    background: white;
}

/* Bloque de lyrics */
.review-block-lyrics {
    background: #1a1a1a;
    color: #f0f0f0;
    font-family: 'Georgia', 'Garamond', serif;
    font-size: 1.05rem;
    font-style: italic;

    padding-left: 20px;
}

.review-block-lyrics::placeholder { color: #666; }
.review-block-lyrics:focus { border-color: var(--accent-red); background: #111; }

/* Botón de borrar bloque */
.review-block-delete {
    position: absolute;
    top: 8px; right: 8px;
    width: 22px; height: 22px;
    border-radius: 50%; border: none;
    background: rgba(255,59,48,0.15);
    color: #ff3b30;
    font-size: 0.6rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 2;
}

.review-block-wrapper:hover .review-block-delete { opacity: 1; }

/* Barra de inserción entre bloques */
.review-insert-bar {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    opacity: 0;
    transition: opacity 0.2s;
}

.review-block-wrapper:hover + .review-insert-bar,
.review-insert-bar:hover { opacity: 1; }

.review-insert-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border-color);
    background: white;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
}

.review-insert-btn:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
}

.review-insert-btn.lyrics:hover {
    background: #1a1a1a;
    border-color: #1a1a1a;
    color: white;
}

/* Botón de review en track */
.track-review-btn {
    background: none; border: none;
    cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center;
    transition: color 0.2s; padding: 0 4px;
    opacity: 0;
}
.track-review-btn svg { width: 15px; height: 15px; }
.track-item:hover .track-review-btn { opacity: 1; }

/* Botón de review en álbum */
.album-review-btn {

}
.album-review-btn.has-review {
    border-color: var(--accent-red);
    color: var(--accent-red);
    background: rgba(230,57,70,0.04);
}
