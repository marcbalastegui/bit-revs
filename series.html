<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Series</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body data-store="series">
<header>
    <div class="header-left">
        <a href="home.html" class="logo">BitRevs</a>
    </div>
    <nav>
        <a href="home.html" class="nav-home-icon" title="Inicio">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <div class="nav-dropdown">
            <span class="nav-dropdown-trigger active">Reviews
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <div class="nav-dropdown-menu">
                <a href="movies.html">Películas</a>
                <a href="series.html" class="active">Series</a>
                <a href="music.html">Music</a>
                <a href="collections.html">Colecciones</a>
            </div>
        </div>
        <a href="top.html">Top Canciones</a>
        <a href="wrapped.html">Wrapped</a>
        <a href="lists.html">Listas</a>
    </nav>
    <div class="header-right">
        <button id="btn-add-media" class="save-btn">+ Añadir Serie</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>

<main>
    <h1>Todas las Series</h1>
    <div class="controls-bar">
        <input type="text" id="filter-input" placeholder="Filtrar por título, creador o año...">
        <select id="sort-select">
            <option value="default">Orden por defecto</option>
            <option value="rating-desc">Nota (Mayor a Menor)</option>
            <option value="rating-asc">Nota (Menor a Mayor)</option>
            <option value="year-desc">Año (Más reciente)</option>
            <option value="year-asc">Año (Más antiguo)</option>
            <option value="title-asc">Título (A-Z)</option>
        </select>
    </div>
    <div class="album-grid" id="media-grid"></div>
</main>

<!-- ── MODAL AÑADIR/EDITAR SERIE ── -->
<div id="modal-add" class="modal hidden">
    <div class="modal-content">
        <h2>Nueva Serie</h2>
        <form id="media-form">
            <label>Póster:</label>
            <input type="file" id="cover" accept="image/*" required>

            <label>Título:</label>
            <input type="text" id="title" required placeholder="Ej: Breaking Bad">

            <label>Creador:</label>
            <input type="text" id="creator" placeholder="Ej: Vince Gilligan">

            <label>Año de inicio:</label>
            <input type="number" id="year" required placeholder="Ej: 2008">

            <label>Duración por episodio (minutos):</label>
            <input type="number" id="duration" placeholder="Ej: 47">

            <label>Género:</label>
            <input type="text" id="genre" placeholder="Ej: Drama, Thriller">

            <label>Puntuación (0-10):</label>
            <input type="text" id="rating" required placeholder="Ej: 9.5">

            <div class="modal-actions">
                <button type="button" id="btn-cancel">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- ── MODAL MÁS DETALLES SERIE ── -->
<div id="modal-details" class="modal hidden">
    <div class="modal-content" style="max-width:520px;">
        <h2 id="details-title">Más detalles</h2>
        <form id="details-form">
            <label>Número de temporadas:</label>
            <input type="number" id="details-seasons" placeholder="Ej: 5">

            <label>Temporada favorita:</label>
            <input type="number" id="details-fav-season" placeholder="Ej: 3">

            <label>Fecha en que la empezaste:</label>
            <input type="date" id="details-start-date">

            <label>Fecha en que la terminaste:</label>
            <input type="date" id="details-end-date">

            <label>Frase memorable:</label>
            <textarea id="details-quote" rows="3"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:#1a1a1a; color:#f0f0f0; font-family:'Georgia',serif; font-size:1rem; font-style:italic; resize:vertical; border-left:4px solid var(--accent-red); border-radius:0 10px 10px 0;"
                placeholder="«Una frase que recuerdes de la serie…»"></textarea>

            <label>Review:</label>
            <textarea id="details-review" rows="5"
                style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-secondary); font-family:'Inter',sans-serif; font-size:0.95rem; resize:vertical; color:var(--text-main);"
                placeholder="Escribe tu opinión sobre la serie…"></textarea>

            <div class="modal-actions">
                <button type="button" id="btn-cancel-details">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-guard.js"></script>
<script src="bitrevs-ui.js"></script>
<script src="db.js"></script>
<script src="series.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js');
    }
</script>
</body>
</html>
