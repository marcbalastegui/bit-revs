<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitRevs - Top</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/top.css">
    <script src="js/core/settings.js"></script>
</head>
<body>

<header>
    <div class="header-right">
        <button style="visibility:hidden;" class="save-btn">+</button>
        <a href="profile.html" class="header-avatar" id="global-header-avatar" title="Mi Perfil">U</a>
    </div>
</header>
<script src="js/core/header.js"></script>

<main>
    <div class="top-page-header">
        <h1 id="top-title">Top</h1>
        <p id="top-subtitle">Cargando ranking…</p>
    </div>

    <!-- Tabs de tipo de contenido -->
    <div class="top-content-tabs">
        <button class="top-content-btn active" id="btn-content-songs">Canciones</button>
        <button class="top-content-btn" id="btn-content-movies">Películas</button>
        <button class="top-content-btn" id="btn-content-series">Series</button>
        <button class="top-content-btn" id="btn-content-artists">Artistas</button>
    </div>

    <!-- Modo mejor/peor — siempre visible -->
    <div class="top-mode-toggle">
        <button class="top-mode-btn active" id="btn-mode-best">Top 100 mejores</button>
        <button class="top-mode-btn" id="btn-mode-worst">Top 100 peores</button>
    </div>

    <!-- Controles específicos de canciones -->
    <div class="controls-bar" id="songs-controls" style="margin-bottom: 24px;">
        <input type="text" id="top-filter" class="top-search-input" placeholder="Filtrar por canción, artista o álbum…">
        <div class="top-tiebreaker-row">
            <select id="top-tiebreaker">
                <option value="album-rating">Desempate: nota del álbum</option>
                <option value="alphabetical">Desempate: alfabético</option>
                <option value="added">Desempate: orden de añadido</option>
            </select>
            <button class="top-dir-btn" id="btn-tiebreaker-dir" title="Cambiar dirección">↓</button>
        </div>
    </div>

    <!-- Controles específicos de películas/series -->
    <div class="controls-bar" id="media-controls" style="margin-bottom: 24px; display:none;">
        <input type="text" id="top-media-filter" class="top-search-input" placeholder="Filtrar por título o director…">
        <div class="top-tiebreaker-row">
            <select id="top-media-tiebreaker">
                <option value="alphabetical">Desempate: alfabético</option>
                <option value="year-desc">Desempate: año (más reciente)</option>
                <option value="year-asc">Desempate: año (más antiguo)</option>
                <option value="added">Desempate: orden de añadido</option>
                <option value="manual">Desempate: orden manual</option>
            </select>
        </div>
    </div>

    <div id="top-list"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/core/firebase-config.js"></script>
<script src="js/core/auth-guard.js"></script>
<script src="js/core/bitrevs-ui.js"></script>
<script src="js/core/db.js"></script>
<script src="js/pages/top.js"></script>
</body>
</html>
